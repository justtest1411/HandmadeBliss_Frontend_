<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Handmade Bliss</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <svg width="40" height="40" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" stroke="#8B4513" stroke-width="6" fill="#fff8f0"/>
                    <text x="50%" y="55%" text-anchor="middle" font-size="50">🧵</text>
                </svg>
                <span>Handmade Bliss</span>
            </div>

            <ul class="nav-links">
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../all-products.html">All Products</a></li>
                <li><a href="../about.html">About</a></li>
                <li><a href="../contact.html">Contact us</a></li>
                <li class="category-menu">
                    <button class="category-toggle" type="button" aria-expanded="false" aria-controls="categoryDropdown">
                        Category <span aria-hidden="true">▾</span>
                    </button>
                    <ul class="category-dropdown" id="categoryDropdown">
                        <li><a href="../all-products.html?category=Home%20Decor">Home Decor</a></li>
                        <li><a href="../all-products.html?category=Jewelry">Jewelry</a></li>
                        <li><a href="../all-products.html?category=Clothing">Clothing</a></li>
                        <li><a href="../all-products.html?category=Beauty%20%26%20Wellness">Beauty & Wellness</a></li>
                        <li><a href="../all-products.html?category=Art%20%26%20Craft">Art & Craft</a></li>
                        <li><a href="../all-products.html?category=Gifts">Gifts</a></li>
                    </ul>
                </li>
            </ul>
            <div class="nav-right">
                <div class="nav-icons">
                    <button onclick="window.location.href='../profile.html'" title="Profile">👤</button>
                    <button onclick="window.location.href='../wishlist.html'" title="Wishlist">❤️</button>
                    <button onclick="window.location.href='../cart.html'" title="Cart">🛒</button>
                </div>
                <button class="admin-btn" onclick="window.location.href='admin.html'">Admin</button>
                <button class="login-btn" onclick="openLoginModal()">Login</button>
            </div>
        </nav>
    </header>

    <main class="products-section">
        <div class="section-heading">
            <p class="section-eyebrow">Admin</p>
            <h1>Add Product</h1>
            <p>Manage the product catalog for Handmade Bliss.</p>
        </div>

        <form id="productForm" class="product-form">
            <div class="form-group">
                <label for="productName">Product name</label>
                <input type="text" id="productName" name="name" required>
            </div>
            <div class="form-group">
                <label for="productDescription">Description</label>
                <textarea id="productDescription" name="description" required></textarea>
            </div>
            <div class="form-group">
                <label for="productPrice">Price</label>
                <input type="number" id="productPrice" name="price" min="0" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="productCategory">Category</label>
                <select id="productCategory" name="category" required>
                    <option value="" selected disabled>Select a category</option>
                    <option>Home Decor</option>
                    <option>Jewelry</option>
                    <option>Clothing</option>
                    <option>Beauty & Wellness</option>
                    <option>Art & Craft</option>
                    <option>Gifts</option>
                </select>
            </div>
            <div class="form-group">
                <label for="productImageUrl">Image URL</label>
                <input type="url" id="productImageUrl" name="image_url">
            </div>
            <div class="form-group">
                <label for="productStock">Stock</label>
                <input type="number" id="productStock" name="stock" min="0" step="1" required>
            </div>
            <button class="btn btn-primary" type="submit">Add product</button>
            <p id="productFormMessage" class="product-form-message" role="status" aria-live="polite"></p>
        </form>
    </main>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="loginTitle">Sign In</h2>
                <button class="close-btn" onclick="closeLoginModal()">&times;</button>
            </div>
            <div id="step1" class="tab-content active">
                <div class="form-group">
                    <label>Email or Phone Number</label>
                    <input type="text" id="emailPhone" placeholder="Enter your email or phone number">
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="nextStep()">Continue</button>
            </div>
            <div id="step2" class="tab-content">
                <div class="form-group">
                    <label>Email or Phone</label>
                    <input type="text" id="emailPhoneDisplay" readonly style="background-color: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="password" placeholder="Enter your password">
                        <span class="toggle-password" onclick="togglePassword()">👁️</span>
                    </div>
                </div>
                <div class="form-buttons">
                    <button class="back-btn" onclick="backStep()">← Back</button>
                    <button class="submit-btn" onclick="login()">Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Handmade Bliss. All rights reserved.</p>
    </footer>

    <script src="../../script.js"></script>
</body>
</html>
